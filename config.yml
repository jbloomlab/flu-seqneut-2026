# === Analysis configuration file ======================================================

__use_yte__: true  # use YAML Template Engine formatting

# --- Configuration for custom analyses in Snakefile outside of seqneut-pipeline --------

# subtypes of strains
subtypes: [H1N1, H3N2]

# `strain_type` assigned to the recent circulating strains in the viral barcodes CSV
circulating_strain_type: circulating_2026

# For the most part our analyses separate recent and historical vaccine strains, but
# consider these vaccine strains to be "recent" and include them alongside the recent strains.
recent_vaccine_strains:
  A/Darwin/1415/2025_H3N2: 2026-2027 cell-based vaccine
  A/Sydney/1359/2024_H3N2: 2026 cell-based vaccine  # originally called A/Alaska/63/2025_H3N2 in library design
  A/District_Of_Columbia/27/2023_H3N2: 2025, 2025-2026 cell-based vaccine
  A/Massachusetts/18/2022_H3N2: 2024, 2024-2025 cell-based vaccine
  A/Missouri/11/2025_cell_H1N1: 2026 and 2026-2027 cell-based vaccine
  A/Wisconsin/67/2022_H1N1: 2023-2024, 2024, 2024-2025, 2025, 2025-2026 cell-based vaccine

# When building the alignment for nextstrain-prot-titers-tree, prepend this sequence onto
# each sequence in the alignment:
nextstrain-prot-titers-tree_prefix_alignment:
  H3N2: ""  # no prefix needed as HAs in viral_barcodes start at HA1 site 1
  H1N1: DTL  # add these three amino acids as HAs in viral barcode miss first 3 ectodomain aas

# Viral library to use for building nextstrain-prot-titers-tree alignment and metadata.
# References a key from viral_libraries (e.g., "designed" or "actual").
nextstrain-prot-titers-tree_viral_library: actual

# Species for which to build tree titers (used to construct input file paths from final_titer_data).
# Set to null to disable titer overlay on trees.
nextstrain-prot-titers-tree_titers_from: null

# Cohorts to show on tree (from cohort column in summarized titers)
serum_cohorts_for_tree: []

# Titer cutoffs for reporting fraction of sera below threshold (used in tree coloring
# and in process_final_titer_data).
titer_cutoffs: &titer_cutoffs [140]

# Configuration for `nextstrain-prot-titers-tree`. For each subtype, provide the indicated arguments
# that have the same meaning described at https://github.com/jbloomlab/nextstrain-prot-titers-tree
nextstrain-prot-titers-tree_config:
  H3N2:
    alignment: results/nextstrain-prot-titers-tree/H3N2/alignment.fa  # built by pipeline
    outgroup: data/nextstrain-prot-titers-tree_data/H3N2_outgroup.fa
    site_numbering_map: data/nextstrain-prot-titers-tree_data/H3N2_site_numbering_map.tsv
    metadata: results/nextstrain-prot-titers-tree/H3N2/metadata.tsv  # built by pipeline
    color_by_metadata:
      strain_type: {}
      subclade: {}
    metadata_columns: [derived_haplotype]
    titers: null
    display_defaults:
      color_by: subclade
      distance_measure: div
      branch_label: aa
      tip_label: derived_haplotype
    results_subdir: results/nextstrain-prot-titers-tree/H3N2/pipeline_results
    auspice_json: auspice/flu-seqneut-2026_H3N2.json
    addtl_export_args:
      title: Near real-time data on human neutralizing antibody landscape to H3N2 influenza virus as of the summer of 2026
      build-url: https://github.com/jbloomlab/flu-seqneut-2026
      maintainers: Caroline Kikawa, Andrew Butler, John Huddleston, Jesse Bloom
  H1N1:
    alignment: results/nextstrain-prot-titers-tree/H1N1/alignment.fa  # built by pipeline
    outgroup: data/nextstrain-prot-titers-tree_data/H1N1_outgroup.fa
    site_numbering_map: data/nextstrain-prot-titers-tree_data/H1N1_site_numbering_map.tsv
    metadata: results/nextstrain-prot-titers-tree/H1N1/metadata.tsv  # built by pipeline
    color_by_metadata:
      strain_type: {}
      subclade: {}
    metadata_columns: [derived_haplotype]
    titers: null
    display_defaults:
      color_by: subclade
      distance_measure: div
      branch_label: aa
      tip_label: derived_haplotype
    results_subdir: results/nextstrain-prot-titers-tree/H1N1/pipeline_results
    auspice_json: auspice/flu-seqneut-2026_H1N1.json
    addtl_export_args:
      title: Near real-time data on human neutralizing antibody landscape to H1N1 influenza virus as of the summer of 2026
      build-url: https://github.com/jbloomlab/flu-seqneut-2026
      maintainers: Caroline Kikawa, Andrew Butler, John Huddleston, Jesse Bloom

# Sera metadata files to aggregate
sera_metadata:
  - data/sera_metadata/sera_for_flu-seqneut-2026_SCH.csv
  - data/sera_metadata/sera_for_flu-seqneut-2026_UWMC.csv
  - data/sera_metadata/sera_for_flu-seqneut-2026_CTS.csv

# Aggregate and QC final processed titer data for each serum group, which must match
# the species designation in the serum metadata.
process_final_titer_data:
  viral_library: actual  # must specify viral library in viral_libraries used to run plate
  min_frac_viruses: 0.9  # only include sera w titers against this fraction of viral strains (among viruses with at least one titer)
  min_frac_sera: 0.8  # only include viral strains w titers against this fraction of sera
  min_frac_action: drop  # "drop" sera / strains below min_frac, or "raise" an error
  sera_to_drop: []  # list names of sera to drop
  viruses_to_drop: []  # list names of viral strains to drop
  titer_cutoffs: *titer_cutoffs  # report fraction below cutoff

# Merged into each subtype's entry in `plot_titer_summaries_params.trees`; override a key
# by restating it there (`<<:` merges shallowly)
default_titer_plot_tree_params: &default_titer_plot_tree_params
  tree_size: 120
  strain_label_font_size: 9
  color_trees_by:  # {name in file names: auspice attr or genotype:GENE:SITE}
    subclade: subclade

# Parameters for titer summary plots
plot_titer_summaries_params:
  titer_cutoff: 140  # initial slider value for fraction below cutoff
  facet_size: 150  # width of each cohort facet column
  initial_cohorts: [All]  # cohorts to initially show in selectable legend, null for all
  trees:  # tree settings per subtype
    H1N1:
      <<: *default_titer_plot_tree_params
      shift_tree_loc: 91  # px shift of tree toward labels
    H3N2:
      <<: *default_titer_plot_tree_params
      shift_tree_loc: 21  # px shift of tree toward labels

# Thresholds a well of a miscellaneous plate must meet for the library QC analyses below
# to trust what it measures. Merged into every `library_qc` analysis with `<<:`
default_library_qc_well_qc_thresholds: &default_library_qc_well_qc_thresholds
  min_avg_barcode_count_per_well: 500
  min_neut_standard_frac_per_well: 0.001

# Subpools the strains are grouped by for reporting, with nothing being made again. A
# strain is assigned to the first subpool whose `regex` its shortname matches, so the
# order matters: the `^flu-seqneut-2026` patterns have to come before the bare subtype
# ones or every strain lands in the old-vaccine subpools. Referenced by any analysis that
# only measures a pool, where `remake` must be false throughout as `corrective_repool` is
# false; an analysis that does re-pool sets its own `remake` flags instead.
library_qc_subpools_no_remake: &library_qc_subpools_no_remake
  flu-seqneut-2026_h1:
    regex: ^flu-seqneut-2026_H1N1
    remake: false
  flu-seqneut-2026_h3:
    regex: ^flu-seqneut-2026_H3N2
    remake: false
  old_h1_vax:
    regex: H1N1
    remake: false
  old_h3_vax:
    regex: H3N2
    remake: false

# Analyses of the composition of a library pool, one entry per pool.
# Assumes pools are equal-volume of all strains.
analyze_pools:
  20260715_equal_vol_pool:
    <<: *default_library_qc_well_qc_thresholds
    miscellaneous_plate: 20260715_equal_vol_pool
    description: |
      An initial pool was made by adding equal volumes of all strains, and this pool was
      then used to infect MDCK-SIAT1 cells over a serial dilution of the pool. The
      barcodes were sequenced to determine the representation of each strain in the pool,
      how much of each strain to add to make a balanced pool, and the pool dilution
      (that is, the MOI) to use in the neutralization assays.
    # Wells in linear range that the composition of the pool is read from.
    # Either "calculate" (recommended), which locates the first 3 linear points of the
    # neutralization-standard curve and takes the middle dilution of it, or a list of wells
    # such as [A8, B8] to override that. Here we are using [A8, B8] solely for backward
    # compatibility with how experiments were done, in future use "calculate"
    linear_range_wells: [A8, B8]
    total_pool_volume: 10307.409  # ul of re-pooled library to make
    subpools:  # strain assigned to the first subpool whose regex its shortname matches
      flu-seqneut-2026_h1: ^flu-seqneut-2026_H1N1
      flu-seqneut-2026_h3: ^flu-seqneut-2026_H3N2
      old_h1_vax: H1N1
      old_h3_vax: H3N2
    strains_to_drop:  # strains excluded from the re-pooling, and why
      A/Bangkok/P2323/2025_H3N2: no rescue
      A/California/LACPHL-INF02113/2025_H3N2: failed rescue
      A/England/1845724/2025_H3N2: no rescue
      A/Galicia/GA-CHUAC-449/2025_H1N1: no rescue
      A/Netherlands/446/2026_H1N1: low titer
      A/Netherlands/1739/2023_H1N1: low titer

# Analyses of how well a balanced re-pool achieved equal representation, one entry per
# re-pool.
#
# `corrective_repool` selects what each entry does. When true the analysis measures the
# pool and then calculates the volumes for a further corrective re-pool, which needs the
# pipetting keys (`total_pool_volume`, `min_pipettable_volume_uL`, `dilution_steps`,
# `strains_to_drop`) and a `previous_pool` to recover the stock titers from. When false it
# measures the pool and stops; the pipetting keys must then be absent, so that a value left
# behind cannot look like one still in effect.
analyze_repools:
  20260731_repool:
    <<: *default_library_qc_well_qc_thresholds
    miscellaneous_plate: 20260731_repool
    # `analyze_pools` key whose re-pooling volumes made this pool, or null to measure this
    # pool without comparing it against them. Referenced by key rather than by path so the
    # path pattern stays in `rules/library_qc.smk`.
    previous_pool: 20260715_equal_vol_pool
    corrective_repool: true
    description: |
      The balanced re-pool made by adding each strain at the volume calculated from the
      initial equal-volume pool, then used to infect MDCK-SIAT1 cells over a serial
      dilution. The barcodes were sequenced to check whether the re-pool actually came out
      balanced, to find which strains are still over-represented, and to calculate the
      volumes for a second corrective re-pool.
    # Wells in linear range that the composition is read from; see `analyze_pools` above
    # for the meaning of "calculate" versus an explicit list.
    linear_range_wells: calculate
    # A strain counts as over-represented when its share of the pool exceeds the
    # equal-representation share (1 / number of strains) by this factor, and as
    # under-represented when its share falls below that share divided by this factor.
    over_representation_factor: 1.5
    under_representation_factor: 1.5
    # ul of corrective re-pooled library to make. 
    total_pool_volume: 10307.409
    # A strain needing less than `min_pipettable_volume_uL` of its stock is instead
    # diluted, and that much more of the dilution added, which delivers the same virus in
    # a volume that can actually be pipetted. The smallest of `dilution_steps` that brings
    # the strain up to the minimum is used, so these are the dilutions to be prepared.
    min_pipettable_volume_uL: 10
    dilution_steps: [2, 5, 10, 20, 50, 100]
    # A strain is assigned to the first subpool whose `regex` its shortname matches, so
    # the order of these entries matters: the `^flu-seqneut-2026` patterns have to come
    # before the bare subtype ones or every strain lands in the old-vaccine subpools.
    #
    # `remake` says whether that subpool is being made again from the individual strain
    # stocks. Set it where the strains within a subpool are badly enough out of balance
    # with each other to be worth repipetting; leave it false to keep the subpool as it
    # is and correct only how much of it goes into the final pool. Either way the
    # subpools are then combined in whatever proportion best balances the final pool.
    subpools:
      flu-seqneut-2026_h1:
        regex: ^flu-seqneut-2026_H1N1
        remake: false
      flu-seqneut-2026_h3:
        regex: ^flu-seqneut-2026_H3N2
        remake: false
      old_h1_vax:
        regex: H1N1
        remake: false
      old_h3_vax:
        regex: H3N2
        remake: true
    strains_to_drop: {}  # strains excluded from the corrective re-pooling, and why

  20260810_repool_wash_spikein_cdna:
    <<: *default_library_qc_well_qc_thresholds
    miscellaneous_plate: 20260810_repool_wash_spikein_cdna
    previous_pool: null
    corrective_repool: false
    description: |
      The rebalanced pool made from the corrective volumes calculated for
      `20260731_repool`, used to infect MDCK-SIAT1 cells over a serial dilution. The
      barcodes were sequenced to check the strain representation that resulted.
      Additionally, in this experiment, the cells were **washed 1x with PBS** prior to
      lysis and the **spikein was added to the cDNA mastermix**.
    linear_range_wells: calculate
    over_representation_factor: 1.5
    under_representation_factor: 1.5
    subpools: *library_qc_subpools_no_remake

  20260810_repool_nowash_spikein_cdna:
    <<: *default_library_qc_well_qc_thresholds
    miscellaneous_plate: 20260810_repool_nowash_spikein_cdna
    previous_pool: null
    corrective_repool: false
    description: |
      The rebalanced pool made from the corrective volumes calculated for
      `20260731_repool`, used to infect MDCK-SIAT1 cells over a serial dilution. The
      barcodes were sequenced to check the strain representation that resulted.
      Additionally, in this experiment, the cells were **not washed** with PBS prior to
      lysis and the **spikein was added to the cDNA mastermix**.
    linear_range_wells: calculate
    over_representation_factor: 1.5
    under_representation_factor: 1.5
    subpools: *library_qc_subpools_no_remake

  20260810_repool_wash_spikein_cdna_h3_44:
    <<: *default_library_qc_well_qc_thresholds
    miscellaneous_plate: 20260810_repool_wash_spikein_cdna_h3_44
    previous_pool: null
    corrective_repool: false
    description: |
      The rebalanced pool made from the corrective volumes calculated for
      `20260731_repool` **with the addition of 1uL of flu-seqneut-2026_H3N2_44**. The
      derived haplotype for this strain is `K:G62E,S145R`. This strain failed to grow
      initially and this experiment was intended to see if we can recover any counts from
      it on a re-rescue/re-passage attempt. This pool was used to infect MDCK-SIAT1 cells
      over a serial dilution. The barcodes were sequenced to check the strain
      representation that resulted. Additionally, in this experiment, the cells were
      **washed 1x with PBS** prior to lysis and the **spikein was added to the cDNA
      mastermix**.
    linear_range_wells: calculate
    over_representation_factor: 1.5
    under_representation_factor: 1.5
    subpools: *library_qc_subpools_no_remake

  20260810_repool_wash_spikein_lysis:
    <<: *default_library_qc_well_qc_thresholds
    miscellaneous_plate: 20260810_repool_wash_spikein_lysis
    previous_pool: null
    corrective_repool: false
    description: |
      The rebalanced pool made from the corrective volumes calculated for
      `20260731_repool` and adjusted further based on the initial plates 5 and 6 data. It
      was used to infect MDCK-SIAT1 cells over a serial dilution. The barcodes were
      sequenced to check the strain representation that resulted. Additionally, in this
      experiment, the cells were **washed 1x with PBS** prior to lysis and the **spikein
      was added to the lysis buffer**.
    linear_range_wells: calculate
    over_representation_factor: 1.5
    under_representation_factor: 1.5
    subpools: *library_qc_subpools_no_remake

# Analyses of the plates that infect each well with a single virus, which check for
# contamination between wells and measure how well each strain grows on its own. 
analyze_single_well_infections:
  20260730_single_well:
    miscellaneous_plates:
      - 20260730_single_well_H3_strains
      - 20260730_single_well_H1_vax_old_strains
    description: |
      Each well of these plates was infected with a single virus of the library rather
      than the pool, with the neutralization standard spiked in. Together they measure how
      well each strain grows on its own, and whether virus from one well ends up in
      another: a well should hold only its own strain and the neutralization standard, so
      anything else in it is contamination, and where that material comes from says
      whether it spilled between neighboring wells or arrived some other way.
    # `viral_libraries` key holding the strains carried forward into the titer
    # measurements. Strains assayed here that were dropped from it are marked in the report.
    # The whitelist the barcodes are counted against is the plates' own `viral_library`.
    final_viral_library: actual
    # A well is reported when more than this fraction of its parsed reads are barcodes of
    # another library strain, and separately when more than this fraction matched no
    # barcode of either whitelist. Both are reporting thresholds: they decide which wells
    # are broken out strain by strain and barcode by barcode, never what is computed.
    max_other_strain_frac: 0.005
    max_unmatched_frac: 0.02

# --- Configuration for `seqneut-pipeline` ----------------------------------------------

seqneut-pipeline: seqneut-pipeline

description: |
  # Near real-time data on the human neutralizing antibody landscape to influenza virus as of the summmer of 2026 to inform vaccine-strain selection

  Study led by Caroline Kikawa, Andrew Butler, John Huddleston, and Jesse Bloom.

  The numerical data and computer code are at [https://github.com/jbloomlab/flu-seqneut-2026](https://github.com/jbloomlab/flu-seqneut-2026)

viral_libraries:
  designed: data/viral_libraries/flu-seqneut-2026-barcode-to-strain-designed.csv
  actual: data/viral_libraries/flu-seqneut-2026-barcode-to-strain-actual.csv


curve_display_method: svg  # set to png8 if HTMLs of notebooks to big

neut_standard_sets:
  loes2023: data/neut_standard_sets/loes2023_neut_standards.csv

illumina_barcode_parser_params:
  upstream: CCTACAATGTCGGATTTGTATTTAATAG
  downstream: ''
  minq: 20
  upstream_mismatch: 4
  bc_orientation: R2

default_process_plate_qc_thresholds: &default_process_plate_qc_thresholds
  avg_barcode_counts_per_well: 500
  min_neut_standard_frac_per_well: 0.005
  no_serum_per_viral_barcode_filters:
    min_frac: 0.0001
    max_fold_change: 4
    max_wells: 2
  per_neut_standard_barcode_filters:
    min_frac: 0.005
    max_fold_change: 4
    max_wells: 2
  min_neut_standard_count_per_well: 1000
  min_no_serum_count_per_viral_barcode_well: 100
  max_frac_infectivity_per_viral_barcode_well: 3
  min_dilutions_per_barcode_serum_replicate: 6

default_process_plate_curvefit_params: &default_process_plate_curvefit_params
  frac_infectivity_ceiling: 1
  fixtop: [0.6, 1]
  fixbottom: 0
  fixslope: [0.8, 10]

default_process_plate_curvefit_qc:  &default_process_plate_curvefit_qc
  max_frac_infectivity_at_least: 0.0  # Allow 'completely neutralized' straight lines to be fit
  goodness_of_fit:  # EITHER R2 must be >= min_R2 or RMSD must be <= max_RMSD
    min_R2: 0.5
    max_RMSD: 0.15  # you may be able to increase this to more like 0.1
  serum_replicates_ignore_curvefit_qc: []
  barcode_serum_replicates_ignore_curvefit_qc: []

default_serum_titer_as: midpoint

collapse_strain_barcodes: True

default_serum_qc_thresholds: &default_serum_qc_thresholds
  min_replicates: 1
  max_fold_change_from_median: 6
  viruses_ignore_qc: []

sera_override_defaults: {}

plates:

  plate1:
    group: human
    date: 2026-08-05
    viral_library: actual
    neut_standard_set: loes2023
    samples_csv: data/plates/20260805_plate1.csv
