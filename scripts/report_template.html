<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
         line-height: 1.55; margin: 0; color: #222; background: #fff; }
  .layout { display: grid; grid-template-columns: 19em minmax(0, 1fr); align-items: start; }
  .sidebar { position: sticky; top: 0; max-height: 100vh; overflow-y: auto;
             padding: 1.5em 1em; border-right: 1px solid #ddd; background: #fafafa;
             font-size: 0.9em; }
  .sidebar h2 { font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.06em;
                color: #666; margin: 0 0 0.6em; }
  .sidebar ul { list-style: none; padding-left: 0.9em; margin: 0.2em 0; }
  .sidebar > .toc > ul { padding-left: 0; }
  .sidebar a { color: #245; text-decoration: none; display: block; padding: 0.16em 0; }
  .sidebar a:hover { text-decoration: underline; }
  .sidebar a.active { font-weight: 600; color: #111; }

  main { min-width: 0; max-width: 60em; padding: 1.5em 2.5em 6em; }
  h1 { line-height: 1.25; margin-top: 0; }
  h2, h3, h4 { line-height: 1.25; }
  h2 { border-bottom: 1px solid #ddd; padding-bottom: 0.2em; margin-top: 2em; }
  .headerlink { visibility: hidden; margin-left: 0.3em; color: #aaa; text-decoration: none; }
  h1:hover .headerlink, h2:hover .headerlink,
  h3:hover .headerlink, h4:hover .headerlink { visibility: visible; }
  table { border-collapse: collapse; margin: 1em 0; font-size: 0.9em; }
  th, td { border: 1px solid #ccc; padding: 0.25em 0.6em; text-align: left; }
  code { background: #f4f4f4; border-radius: 3px; padding: 0.1em 0.3em;
         font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         font-size: 0.9em; }
  pre code { display: block; padding: 0.8em; overflow-x: auto; }

  figure.embed { margin: 1.6em 0; }
  /* The height set here is what stands until the chart can be measured, and is all a
     cross-origin frame -- an embedded tree, or any embed opened over `file://` -- ever
     gets. `data-height` on the frame overrides it for embeds that cannot be measured. */
  iframe.embed { display: block; width: 100%; height: 600px; border: 1px solid #ddd;
                 border-radius: 4px; background: #fff; }
  figure.figure { margin: 1.6em 0; }
  figure.figure img { display: block; max-width: 100%; height: auto;
                      border: 1px solid #ddd; border-radius: 4px; background: #fff; }
  figcaption { font-size: 0.9em; color: #555; margin-top: 0.5em; }
  figcaption a { color: #245; }

  @media (max-width: 60em) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; max-height: 22em; border-right: none;
               border-bottom: 1px solid #ddd; }
    main { padding: 1em; }
  }
</style>
</head>
<body>
<div class="layout">
<nav class="sidebar"><h2>Contents</h2>
$toc
</nav>
<main>
$body
</main>
</div>
<script>
(function () {
  var MIN_HEIGHT = 250;   // px, so a chart still drawing is not a sliver
  var MAX_HEIGHT = 4000;  // px, so one embed cannot swallow the whole page

  // Throws or returns null when the frame is cross-origin, which is the case for an
  // embedded Nextstrain tree and for every embed when the page is opened over `file://`.
  function documentOf(frame) {
    try {
      return frame.contentDocument;
    } catch (err) {
      return null;
    }
  }

  function fit(frame) {
    var doc = documentOf(frame);
    if (!doc || !doc.body) return;
    var style = frame.contentWindow.getComputedStyle(doc.body);
    // The body's own box, not `documentElement`: `documentElement` grows to fill the
    // height we set, so measuring it would let the frame grow but never shrink back.
    var height = doc.body.getBoundingClientRect().height
      + parseFloat(style.marginTop) + parseFloat(style.marginBottom);
    height = Math.min(Math.max(Math.ceil(height) + 2, MIN_HEIGHT), MAX_HEIGHT);
    frame.style.height = height + "px";
  }

  function watch(frame) {
    var doc = documentOf(frame);
    if (!doc || !doc.body) return;  // cannot measure it; the CSS height stands
    fit(frame);
    if (window.ResizeObserver) {
      // Clicking a serum cohort in a chart's legend adds or drops a facet row, so the
      // height changes long after load; observing the body catches every such relayout.
      new ResizeObserver(function () { fit(frame); }).observe(doc.body);
    }
    // vega draws asynchronously after `load`, so measure again once it has settled
    setTimeout(function () { fit(frame); }, 400);
    setTimeout(function () { fit(frame); }, 2500);
  }

  var frames = document.querySelectorAll("iframe.embed");
  for (var i = 0; i < frames.length; i++) {
    (function (frame) {
      var height = frame.getAttribute("data-height");
      if (height) {
        frame.style.height = height + "px";
        return;  // an explicit height means the frame is not to be measured
      }
      var doc = documentOf(frame);
      if (doc && doc.readyState === "complete") {
        watch(frame);  // served from cache, so `load` will not fire again
      } else {
        frame.addEventListener("load", function () { watch(frame); });
      }
    })(frames[i]);
  }

  // highlight the sidebar entry for the section currently in view
  if (window.IntersectionObserver) {
    var links = {};
    var anchors = document.querySelectorAll(".sidebar a[href^='#']");
    for (var j = 0; j < anchors.length; j++) {
      links[decodeURIComponent(anchors[j].hash.slice(1))] = anchors[j];
    }
    var spy = new IntersectionObserver(function (entries) {
      for (var k = 0; k < entries.length; k++) {
        if (!entries[k].isIntersecting) continue;
        var active = document.querySelectorAll(".sidebar a.active");
        for (var m = 0; m < active.length; m++) active[m].classList.remove("active");
        links[entries[k].target.id].classList.add("active");
      }
    }, { rootMargin: "0px 0px -80% 0px" });
    for (var id in links) {
      var heading = document.getElementById(id);
      if (heading) spy.observe(heading);
    }
  }
})();
</script>
</body>
</html>
