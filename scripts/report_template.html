<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
         line-height: 1.55; margin: 0; color: #222; background: #fff; }
  .layout { display: grid; grid-template-columns: 19em minmax(0, 1fr); align-items: start; }
  .sidebar { position: sticky; top: 0; max-height: 100vh; overflow-y: auto;
             padding: 1.5em 1em; border-right: 1px solid #ddd; background: #fafafa;
             font-size: 0.9em; }
  .sidebar h2 { font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.06em;
                color: #666; margin: 0 0 0.6em; }
  .sidebar ul { list-style: none; padding-left: 0.9em; margin: 0.2em 0; }
  .sidebar > .toc > ul { padding-left: 0; }
  .sidebar a { color: #245; text-decoration: none; display: block; padding: 0.16em 0; }
  .sidebar a:hover { text-decoration: underline; }
  .sidebar a.active { font-weight: 600; color: #111; }

  main { min-width: 0; padding: 1.5em 2.5em 6em; }
  h1 { line-height: 1.25; margin-top: 0; }
  h2, h3, h4 { line-height: 1.25; }
  h2 { border-bottom: 1px solid #ddd; padding-bottom: 0.2em; margin-top: 2em; }
  .headerlink { visibility: hidden; margin-left: 0.3em; color: #aaa; text-decoration: none; }
  h1:hover .headerlink, h2:hover .headerlink,
  h3:hover .headerlink, h4:hover .headerlink { visibility: visible; }
  table { border-collapse: collapse; margin: 1em 0; font-size: 0.9em; }
  th, td { border: 1px solid #ccc; padding: 0.25em 0.6em; text-align: left; }
  code { background: #f4f4f4; border-radius: 3px; padding: 0.1em 0.3em;
         font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
         font-size: 0.9em; }
  pre code { display: block; padding: 0.8em; overflow-x: auto; }

  /* Prose keeps a readable measure; an embed spans the whole column so a wide chart is
     not cut off. This height is the fallback: the script at the foot of the page fits
     each frame to the page it holds, and a window's height stays in place for a frame
     that cannot be fitted -- one holding a page from another site, any frame at all when
     the report is opened from disk rather than served, and a page sizing itself off its
     frame. */
  main > * { max-width: 60em; }
  figure.embed { margin: 1.6em 0; max-width: none; }
  iframe.embed { display: block; width: 100%; height: 100vh; border: 1px solid #ddd;
                 border-radius: 4px; background: #fff; }
  figure.table { margin: 1.6em 0; }
  figure.table table { margin: 0; }
  table tfoot td { font-weight: bold; }
  figure.figure { margin: 1.6em 0; }
  figure.figure img { display: block; max-width: 100%; height: auto;
                      border: 1px solid #ddd; border-radius: 4px; background: #fff; }
  figcaption { font-size: 0.9em; color: #555; margin-top: 0.5em; }
  figcaption a { color: #245; }

  @media (max-width: 60em) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; max-height: 22em; border-right: none;
               border-bottom: 1px solid #ddd; }
    main { padding: 1em; }
  }
</style>
</head>
<body>
<div class="layout">
<nav class="sidebar"><h2>Contents</h2>
$toc
</nav>
<main>
$body
</main>
</div>
<script>
(function () {
  // highlight the sidebar entry for the section currently in view
  if (window.IntersectionObserver) {
    var links = {};
    var anchors = document.querySelectorAll(".sidebar a[href^='#']");
    for (var j = 0; j < anchors.length; j++) {
      links[decodeURIComponent(anchors[j].hash.slice(1))] = anchors[j];
    }
    var spy = new IntersectionObserver(function (entries) {
      for (var k = 0; k < entries.length; k++) {
        if (!entries[k].isIntersecting) continue;
        var active = document.querySelectorAll(".sidebar a.active");
        for (var m = 0; m < active.length; m++) active[m].classList.remove("active");
        links[entries[k].target.id].classList.add("active");
      }
    }, { rootMargin: "0px 0px -80% 0px" });
    for (var id in links) {
      var heading = document.getElementById(id);
      if (heading) spy.observe(heading);
    }
  }
})();

(function () {
  // Fit each embedded chart to the page it holds, so a short chart leaves no dead space
  // below it and a tall one needs no scrolling inside its frame. The CSS gives every
  // frame a window's height, and that stays in place for a frame this cannot measure:
  // one holding a page from another site, and every frame when the report is opened from
  // disk, where a browser treats a frame's document as another origin.
  //
  // Only a chart page is fitted, recognized by the `vis` container Vega-Embed draws
  // into. A page that sizes itself off its frame -- the structure viewers give their
  // viewer `80vh` -- would shrink on every pass, since inside a frame `vh` resolves
  // against the very height being set.

  // A page measuring shorter than this has not drawn its chart yet, since Vega draws
  // asynchronously and `load` can fire on an all but empty document. Such a frame keeps
  // the CSS height rather than collapsing, and the observer fits it once the chart
  // appears.
  var MIN_FITTABLE = 120;

  // The height of a frame's own content, or null if there is none to fit. Deliberately
  // not `documentElement.scrollHeight`, which never reports less than the frame's own
  // height: measured that way a frame could only ever grow, leaving a chart shorter than
  // the window the dead space this is here to remove.
  function pageHeight(frame) {
    var doc;
    try {
      doc = frame.contentDocument;
    } catch (e) {
      return null; // a page from another site
    }
    if (!doc || !doc.body || !doc.getElementById("vis")) return null;
    var win = frame.contentWindow;
    var margins = win.getComputedStyle(doc.body);
    var content = Math.max(
      doc.body.getBoundingClientRect().height +
        parseFloat(margins.marginTop) + parseFloat(margins.marginBottom),
      doc.documentElement.getBoundingClientRect().height
    );
    // Room for the horizontal scrollbar a chart wider than its frame puts inside the
    // frame; without it that scrollbar covers the foot of the chart and the frame
    // scrolls vertically to reach what it covered. Zero when there is no scrollbar.
    var scrollbar = win.innerHeight - doc.documentElement.clientHeight;
    return Math.ceil(content + Math.max(scrollbar, 0));
  }

  function fit(frame) {
    var height = pageHeight(frame);
    if (height === null || height < MIN_FITTABLE) return;
    // writing an unchanged height would have the observer below refire for nothing
    if (frame.style.height !== height + "px") frame.style.height = height + "px";
  }

  var frames = document.querySelectorAll("iframe.embed");
  for (var n = 0; n < frames.length; n++) {
    // Every embed is loaded lazily, so a frame below the fold reaches this whenever the
    // reader scrolls down to it.
    frames[n].addEventListener("load", function () {
      var frame = this;
      if (pageHeight(frame) === null) return;
      fit(frame);
      // Refit whenever the page's own height changes: a chart redrawn by one of its own
      // controls, since toggling a cohort adds a facet row, or one whose widgets
      // rewrapped because the window was resized.
      var Observer = frame.contentWindow.ResizeObserver;
      if (Observer) {
        new Observer(function () {
          fit(frame);
        }).observe(frame.contentDocument.body);
      }
    });
  }
})();
</script>
</body>
</html>
